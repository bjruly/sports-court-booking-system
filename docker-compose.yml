services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5101:8080"          # mở web ở http://localhost:5101
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Chuỗi kết nối sẵn cho sau này khi nhóm thêm EF Core + PostgreSQL
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
