services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5101:8080"          # mở web ở http://localhost:5101
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Ứng dụng dùng PostgreSQL (EF Core + Npgsql). Tên host "db" là tên service bên dưới.
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # chờ PostgreSQL sẵn sàng mới chạy web
    restart: on-failure
    volumes:
      # Lưu khóa mã hóa cookie đăng nhập, để build lại container không bị đăng xuất / lỗi token
      - dpkeys:/root/.aspnet/DataProtection-Keys

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"          # để kết nối bằng công cụ trên máy: localhost:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin: giao diện web quản lý PostgreSQL, mở ở http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmindata:/var/lib/pgadmin

volumes:
  dpkeys:
  pgdata:
  pgadmindata:
